name: Atualizar catálogo
on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *'
permissions:
  contents: write
concurrency:
  group: catalog-update
  cancel-in-progress: false
jobs:
  sync:
    if: ${{ vars.JOBS_FEED_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run sync
        env:
          JOBS_FEED_URL: ${{ vars.JOBS_FEED_URL }}
      - name: Salvar catálogo
        run: |
          git config user.name 'catalog-bot'
          git config user.email 'catalog-bot@users.noreply.github.com'
          git add public/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualiza catálogo de vagas"
            git push
          fi
